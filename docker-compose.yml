# ============================================
# VOLUMES
# ============================================
volumes:
  pgdata:
    driver: local
  pgadmin_data:
    driver: local
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local
  api_gateway_logs:
    driver: local
  auth_service_logs:
    driver: local
  admin_service_logs:
    driver: local
  blog_service_logs:
    driver: local
  notification_service_logs:
    driver: local
  support_service_logs:
    driver: local
  uploaded_files:
    driver: local

# ============================================
# NETWORKS
# ============================================
networks:
  traefik-network:
    external: true

