      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "${ADMIN_SERVICE_PORT}:${ADMIN_SERVICE_PORT}"
    # volumes:
    #   - admin_service_logs:/app/logs
    networks:
      - traefik-network
    healthcheck:
